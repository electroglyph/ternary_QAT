[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ternary_QAT"
version = "0.1.4"
description = "Ternary QAT for transformers, built for Ternary-Bonsai by Prism-ML"
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
peft = ["peft>=0.10"]
transformers = ["transformers>=4.40"]

